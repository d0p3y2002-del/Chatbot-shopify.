<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ brand.gym_display_name }} Chat</title>
  <link rel="stylesheet" href="/static/widget.css" />

  <style>
    :root{
      --primary: {{ brand.primary_color }};
      --secondary: {{ brand.secondary_color }};
    }
    body[data-theme="dark"]{
      background:#0b1220;
      color:#f3f4f6;
    }
    body[data-theme="light"]{
      background:#ffffff;
      color:#0f172a;
    }
  </style>
</head>

<body data-theme="{{ brand.theme }}">
  <div class="chat-shell">
    <header class="chat-header">
      <div class="brand">
        {% if brand.logo_url %}
          <img class="logo" src="{{ brand.logo_url }}" alt="Logo" />
        {% endif %}
        <div class="titles">
          <div class="name">{{ brand.gym_display_name }}</div>
          <div class="sub">Chat</div>
        </div>
      </div>
    </header>

    <main id="messages" class="chat-messages" aria-live="polite"></main>

    <footer class="chat-footer">
      <form id="chatForm" class="chat-form" autocomplete="off">
        <input
          id="q"
          class="chat-input"
          type="text"
          placeholder="Type your message…"
          maxlength="600"
          required
        />
        <button id="sendBtn" class="send-btn" type="submit">Send</button>
      </form>

      <!-- ✅ Powered-by line under the text bar -->
      <div class="powered-by">
        <a href="{{ brand.powered_by_url }}" target="_blank" rel="noopener noreferrer">
          {{ brand.powered_by_text }}
        </a>
      </div>
    </footer>
  </div>

  <script>
    const gymName = {{ gym_name|tojson }};
    const welcomeMessage = {{ brand.welcome_message|tojson }};

    const messagesEl = document.getElementById('messages');
    const form = document.getElementById('chatForm');
    const qInput = document.getElementById('q');
    const sendBtn = document.getElementById('sendBtn');

    function addBubble(text, who) {
      const row = document.createElement('div');
      row.className = 'msg-row ' + who;

      const bubble = document.createElement('div');
      bubble.className = 'bubble ' + who;
      bubble.textContent = text;

      row.appendChild(bubble);
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addLinks(links) {
      if (!Array.isArray(links) || !links.length) return;

      const row = document.createElement('div');
      row.className = 'msg-row bot';

      const box = document.createElement('div');
      box.className = 'link-box';

      links.forEach(l => {
        const a = document.createElement('a');
        a.href = l.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.className = 'link-btn';
        a.textContent = l.label || 'Open link';
        box.appendChild(a);
      });

      row.appendChild(box);
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // initial welcome
    addBubble(welcomeMessage, 'bot');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = (qInput.value || '').trim();
      if (!question) return;

      addBubble(question, 'user');
      qInput.value = '';
      qInput.focus();

      sendBtn.disabled = true;
      sendBtn.textContent = '...';

      try {
        const res = await fetch(`/chat/${encodeURIComponent(gymName)}`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ question })
        });

        if (!res.ok) {
          addBubble('Something went wrong. Please try again.', 'bot');
          return;
        }

        const data = await res.json();
        addBubble(data.answer || 'OK', 'bot');

        if (data.links) addLinks(data.links);

        // If you later want enquiry CTA button UI, you can render data.cta here.
      } catch (err) {
        addBubble('Network error. Please try again.', 'bot');
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send';
      }
    });
  </script>
</body>
</html>
