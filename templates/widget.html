<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ brand.gym_display_name }} — Chat</title>

  <style>
    :root{
      --bg:#0b0b0d;
      --panel:#111116;
      --panel2:#15151c;
      --text:#f2f2f4;
      --muted:#a9a9b2;
      --border:rgba(255,255,255,.10);
      --accent: {{ brand.primary_color }};
      --bubble:#181821;
    }

    *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;}

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      height:100vh;
      display:flex;
      flex-direction:column;
    }

    /* Header */
    .topbar{
      display:flex;
      gap:10px;
      align-items:center;
      padding:14px;
      border-bottom:1px solid var(--border);
      background:linear-gradient(180deg,var(--panel),rgba(17,17,22,.85));
    }

    .logo{
      width:30px;
      height:30px;
      border-radius:8px;
      overflow:hidden;
      background:var(--panel2);
      display:flex;
      align-items:center;
      justify-content:center;
      border:1px solid var(--border);
    }
    .logo img{width:100%;height:100%;object-fit:contain;}

    .titlewrap{display:flex;flex-direction:column;line-height:1.2}
    .title{font-weight:700;font-size:14px}
    .subtitle{font-size:12px;color:var(--muted)}

    /* Chat */
    .chat{
      flex:1;
      overflow:auto;
      padding:16px;
    }

    .row{display:flex;margin:10px 0;}
    .row.user{justify-content:flex-end;}

    .bubble{
      max-width:85%;
      border:1px solid var(--border);
      background:var(--bubble);
      padding:10px 12px;
      border-radius:12px;
      white-space:pre-wrap;
      font-size:13.5px;
      box-shadow:0 10px 25px rgba(0,0,0,.18);
    }

    .row.user .bubble{
      background:rgba(255,255,255,.06);
      border-color:rgba(255,255,255,.12);
    }

    .links{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:10px;
    }

    .linkbtn{
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.06);
      color:var(--text);
      padding:8px 10px;
      border-radius:999px;
      font-size:12.5px;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
    }

    /* CTA */
    .ctaBar{
      display:none;
      padding:10px 14px 0;
      background:linear-gradient(0deg,var(--panel),rgba(17,17,22,.85));
      border-top:1px solid var(--border);
    }

    .ctaButton{
      width:100%;
      border:none;
      background:var(--accent);
      color:#000;
      font-weight:800;
      padding:12px 14px;
      border-radius:12px;
      cursor:pointer;
    }

    /* Composer */
    .composer{
      padding:10px 14px 14px;
      background:linear-gradient(0deg,var(--panel),rgba(17,17,22,.85));
      border-top:1px solid var(--border);
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .inputrow{
      display:flex;
      gap:10px;
    }

    input{
      flex:1;
      border-radius:12px;
      border:1px solid var(--border);
      background:rgba(255,255,255,.04);
      color:var(--text);
      padding:12px;
      font-size:13.5px;
      outline:none;
    }

    .send{
      width:74px;
      border:none;
      border-radius:12px;
      background:var(--accent);
      color:#000;
      font-weight:800;
      cursor:pointer;
    }

    /* Powered by */
    .footer{
      display:flex;
      justify-content:center;
      font-size:11px;
      color:rgba(255,255,255,.55);
    }

    .footer a{
      color:rgba(255,255,255,.75);
      text-decoration:none;
      border-bottom:1px dotted rgba(255,255,255,.35);
    }

    .footer a:hover{color:#fff;}
  </style>
</head>

<body>

  <!-- Header -->
  <div class="topbar">
    <div class="logo">
      {% if brand.logo_url %}
        <img src="{{ brand.logo_url }}" alt="logo">
      {% else %}
        <span style="color:var(--muted);font-weight:800;">≡</span>
      {% endif %}
    </div>
    <div class="titlewrap">
      <div class="title">{{ brand.gym_display_name }}</div>
      <div class="subtitle">AI receptionist</div>
    </div>
  </div>

  <!-- Chat -->
  <div id="chat" class="chat"></div>

  <!-- CTA -->
  <div id="ctaBar" class="ctaBar">
    <button id="ctaBtn" class="ctaButton">Send enquiry</button>
  </div>

  <!-- Composer -->
  <div class="composer">
    <div class="inputrow">
      <input id="q" placeholder="Ask about classes, coaches, joining…" />
      <button id="send" class="send">Send</button>
    </div>

    <div class="footer">
      Powered by
      <a href="{{ brand.powered_by_url }}" target="_blank" rel="noopener noreferrer">
        {{ brand.powered_by_text }}
      </a>
    </div>
  </div>

  <script>
    const gymName = {{ gym_name|tojson }};
    const brand = {{ brand|tojson }};

    const chatEl = document.getElementById("chat");
    const qEl = document.getElementById("q");
    const sendEl = document.getElementById("send");
    const ctaBar = document.getElementById("ctaBar");
    const ctaBtn = document.getElementById("ctaBtn");

    function addBubble(text, who="bot", links=[]) {
      const row = document.createElement("div");
      row.className = "row " + (who === "user" ? "user" : "bot");

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      if (links.length) {
        const box = document.createElement("div");
        box.className = "links";
        links.forEach(l => {
          const a = document.createElement("a");
          a.className = "linkbtn";
          a.href = l.url;
          a.target = "_blank";
          a.textContent = l.label || "Open link";
          box.appendChild(a);
        });
        bubble.appendChild(box);
      }

      row.appendChild(bubble);
      chatEl.appendChild(row);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    addBubble(brand.welcome_message || "Hi — welcome! How can I help?");

    async function ask(q) {
      addBubble(q, "user");
      qEl.value = "";

      const res = await fetch(`/chat/${encodeURIComponent(gymName)}`, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({ question:q })
      });

      const data = await res.json();
      addBubble(data.answer || "How can I help?", "bot", data.links || []);
    }

    sendEl.onclick = () => qEl.value.trim() && ask(qEl.value.trim());
    qEl.onkeydown = e => e.key === "Enter" && qEl.value.trim() && ask(qEl.value.trim());
  </script>

</body>
</html>
